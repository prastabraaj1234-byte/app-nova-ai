# A generic, single database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = %(here)s/alembic

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = %(here)s

# version path separator; As mentioned above, this is the character used to split
# version_locations. Valid values are: os, :, ; or space
version_path_separator = os

# DO NOT set sqlalchemy.url here.
# Runtime database selection is authoritatively driven by environment variables
# and src.config.settings.DATABASE_URL. See ADR-001 / LOCAL_DEVELOPMENT.md.
# sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
