version: '3.8'

services:
  postgres:
    # Maintained, version-pinned PostgreSQL 16 image with pgvector pre-installed
    image: pgvector/pgvector:pg16
    container_name: nova_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nova_ai
    ports:
      - "5432:5432"
    volumes:
      - nova_pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nova_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nova_pgdata:
